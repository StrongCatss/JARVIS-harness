[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-cil"
version = "0.3.1"
description = "贾维斯, a personal Windows desktop butler built on Codex."
readme = "README.txt"
requires-python = ">=3.11"
dependencies = [
    "Markdown>=3.7,<4",
    "PySide6>=6.8,<7",
    "Pygments>=2.18,<3",
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
codex-cil = "codex_cil.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q"
pythonpath = ["src"]
